<!doctype html><html><head><meta charset="utf-8"><title>Claywell browser checks</title><style>body{font:15px Arial;background:#f4f4ea;color:#253e2f;padding:24px}iframe{width:1100px;height:850px;border:1px solid #aaa}li{padding:5px}.pass{color:#21663a}.fail{color:#b22624}</style></head><body><h1>Claywell browser checks</h1><p id="summary">Running…</p><ol id="results"></ol><iframe src="../?test=1" title="App under test"></iframe><script type="module">
const frame=document.querySelector('iframe'),results=document.querySelector('#results');let passed=0,failed=0;const wait=ms=>new Promise(r=>setTimeout(r,ms));
function check(name,condition){let li=document.createElement('li');li.className=condition?'pass':'fail';li.textContent=(condition?'PASS: ':'FAIL: ')+name;results.append(li);condition?passed++:failed++;}
frame.addEventListener('load',async()=>{await wait(100);const d=frame.contentDocument,w=frame.contentWindow,$=id=>d.getElementById(id),canvas=$('viewport');const click=id=>$(id).click();let downloads=[];
d.addEventListener('click',e=>{if(e.target.tagName==='A'&&e.target.download){downloads.push({name:e.target.download,text:fetch(e.target.href).then(r=>r.text())});e.preventDefault();}},true);
try{
check('Fixed-resolution mesh count is visible',$('vertex-count').textContent==='1,962 vertices');check('Canvas has rendered pixels',!!canvas.getContext('2d').getImageData(300,300,1,1).data[3]);
click('save');let initial=JSON.parse(await downloads.at(-1).text);check('Editable project saves every vertex',initial.vertices.length===1962);
canvas.focus();canvas.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Enter',bubbles:true}));click('save');let sculpted=JSON.parse(await downloads.at(-1).text);check('Keyboard brush stamp changes real geometry',JSON.stringify(sculpted.vertices)!==JSON.stringify(initial.vertices));
click('undo');click('save');check('Undo exactly restores mesh',JSON.stringify(JSON.parse(await downloads.at(-1).text).vertices)===JSON.stringify(initial.vertices));click('redo');click('save');check('Redo exactly restores sculpt',JSON.stringify(JSON.parse(await downloads.at(-1).text).vertices)===JSON.stringify(sculpted.vertices));
d.querySelector('[data-brush="carve"]').click();check('Carve is selected',d.querySelector('[data-brush="carve"]').getAttribute('aria-pressed')==='true');
d.querySelector('[data-brush="smooth"]').click();check('Smooth is selected',$('brush-caption').textContent==='SMOOTH BRUSH');
d.querySelector('[data-brush="orbit"]').click();check('Orbit mode is selected',$('mode-label').textContent==='ORBIT MODE');d.querySelector('[data-brush="inflate"]').click();
$('radius').value=100;$('radius').dispatchEvent(new w.Event('input'));check('Brush radius control updates',$('radius-value').textContent==='100 px');$('strength').value=80;$('strength').dispatchEvent(new w.Event('input'));check('Brush strength control updates',$('strength-value').textContent==='80%');
d.querySelector('[data-color="#88a99b"]').click();check('Material switch becomes active',d.querySelector('[data-color="#88a99b"]').classList.contains('active'));
click('wire');check('Wire overlay toggles',$('wire').getAttribute('aria-pressed')==='true');click('wire');
click('save');d.querySelector('[data-form="sphere"]').click();check('Sphere preset loads',$('project-name').textContent==='Untitled sphere');click('undo');check('Preset replacement is undoable',$('project-name').textContent==='The seed study');
click('export');let obj=await downloads.at(-1).text;check('OBJ exports correct vertex count',obj.split('\n').filter(l=>l.startsWith('v ')).length===1962);check('OBJ exports correct face count',obj.split('\n').filter(l=>l.startsWith('f ')).length===3920);
let dt=new w.DataTransfer();dt.items.add(new w.File(['{}'],'bad.claywell',{type:'application/json'}));$('file').files=dt.files;$('file').dispatchEvent(new w.Event('change'));await wait(30);check('Malformed import is rejected without losing work',$('status').textContent.includes('Could not open')&&$('project-name').textContent==='The seed study');
click('save');let good=new w.DataTransfer();good.items.add(new w.File([JSON.stringify(initial)],'valid.claywell',{type:'application/json'}));$('file').files=good.files;$('file').dispatchEvent(new w.Event('change'));await wait(30);check('Valid project restores saved geometry',$('status').textContent==='Project opened.');click('save');check('Restored mesh matches original data',JSON.stringify(JSON.parse(await downloads.at(-1).text).vertices)===JSON.stringify(initial.vertices));
canvas.focus();canvas.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Enter',bubbles:true}));const oldConfirm=w.confirm;w.confirm=()=>false;d.querySelector('[data-form="pebble"]').click();check('Cancelled preset preserves sculpt',$('project-name').textContent==='The seed study');w.confirm=oldConfirm;
check('Tool Shed backlink correct',d.querySelector('.shed').href==='https://intrepion.github.io/tools/');
}catch(e){check('Unexpected browser exception: '+e.message,false);}document.querySelector('#summary').textContent=`${passed} passed · ${failed} failed`;});
</script></body></html>
